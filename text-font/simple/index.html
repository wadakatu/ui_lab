<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Type Playground | UI Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="texture-overlay"></div>

  <header class="header">
    <a href="../../index.html" class="back-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Back to Lab</span>
    </a>
    <div class="header-title">
      <span class="tag">Basic</span>
      <h1>Simple Type Playground</h1>
    </div>
  </header>

  <main class="main">
    <section class="type-lab" aria-label="Type Playground">
      <aside class="control-panel" aria-label="Typography controls">
        <div class="panel-section">
          <span class="section-kicker">Family</span>
          <div class="font-options" role="group" aria-label="Font family">
            <button class="font-option is-active" type="button" data-font="sans">
              <span class="font-name">Sans</span>
              <span class="font-sample">Aa</span>
            </button>
            <button class="font-option" type="button" data-font="serif">
              <span class="font-name">Serif</span>
              <span class="font-sample">Aa</span>
            </button>
            <button class="font-option" type="button" data-font="mono">
              <span class="font-name">Mono</span>
              <span class="font-sample">Aa</span>
            </button>
            <button class="font-option" type="button" data-font="display">
              <span class="font-name">Display</span>
              <span class="font-sample">Aa</span>
            </button>
          </div>
        </div>

        <div class="panel-section">
          <label class="section-kicker" for="sampleText">Text</label>
          <textarea id="sampleText" spellcheck="false">文字のリズムを整える。
Typography makes interfaces feel calm, sharp, and readable.
0123456789 / UI Lab</textarea>
        </div>

        <div class="panel-section control-stack">
          <label class="range-control" for="fontSize">
            <span>Size</span>
            <strong><output id="fontSizeValue" for="fontSize">40px</output></strong>
            <input id="fontSize" type="range" min="14" max="88" value="40">
          </label>

          <label class="range-control" for="fontWeight">
            <span>Weight</span>
            <strong><output id="fontWeightValue" for="fontWeight">600</output></strong>
            <input id="fontWeight" type="range" min="300" max="900" step="100" value="600">
          </label>

          <label class="range-control" for="lineHeight">
            <span>Line</span>
            <strong><output id="lineHeightValue" for="lineHeight">1.25</output></strong>
            <input id="lineHeight" type="range" min="0.9" max="2" step="0.05" value="1.25">
          </label>

          <label class="range-control" for="letterSpacing">
            <span>Tracking</span>
            <strong><output id="letterSpacingValue" for="letterSpacing">0px</output></strong>
            <input id="letterSpacing" type="range" min="0" max="8" step="0.1" value="0">
          </label>

          <label class="range-control" for="measure">
            <span>Measure</span>
            <strong><output id="measureValue" for="measure">54ch</output></strong>
            <input id="measure" type="range" min="24" max="86" value="54">
          </label>
        </div>

        <div class="panel-section switch-row">
          <label class="switch-control">
            <input id="italicToggle" type="checkbox">
            <span class="switch-track"></span>
            <span>Italic</span>
          </label>
          <label class="switch-control">
            <input id="uppercaseToggle" type="checkbox">
            <span class="switch-track"></span>
            <span>Uppercase</span>
          </label>
        </div>

        <div class="action-row">
          <button class="ghost-button" id="resetButton" type="button">Reset</button>
          <button class="primary-button" id="copyButton" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>Copy CSS</span>
          </button>
        </div>
      </aside>

      <section class="preview-panel" aria-label="Live preview">
        <div class="preview-toolbar">
          <span id="currentFont">Sans</span>
          <span id="currentMetrics">40px / 600 / 1.25</span>
        </div>

        <div class="specimen-frame">
          <div class="specimen-paper">
            <p class="preview-text" id="previewText"></p>
          </div>
        </div>

        <div class="output-panel">
          <div class="output-head">
            <span>CSS</span>
            <span id="copyStatus" aria-live="polite"></span>
          </div>
          <pre><code id="cssOutput"></code></pre>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

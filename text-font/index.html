<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text / Font Gallery | UI Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #16161f;
      --text-primary: #e8e8ed;
      --text-secondary: #8b8b9a;
      --text-muted: #5a5a6a;
      --accent-cyan: #00f5d4;
      --accent-green: #39ff14;
      --accent-purple: #bf5af2;
      --accent-warm: #ffb25f;
      --border-color: rgba(255, 255, 255, 0.06);
      --grid-color: rgba(0, 245, 212, 0.03);
      --grid-color-warm: rgba(255, 178, 95, 0.04);
      --glow-type: 0 0 24px rgba(255, 178, 95, 0.32);
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Outfit', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text-primary);
      background: var(--bg-primary);
      font-family: var(--font-sans);
      line-height: 1.6;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
        linear-gradient(var(--grid-color-warm) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color-warm) 1px, transparent 1px);
      background-size: 60px 60px, 60px 60px, 120px 120px, 120px 120px;
      pointer-events: none;
      z-index: 0;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .breadcrumb {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 24px 0;
    }

    .breadcrumb a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 12px;
      transition: color 0.3s;
    }

    .breadcrumb a:hover {
      color: var(--accent-warm);
    }

    .breadcrumb svg {
      width: 16px;
      height: 16px;
    }

    .header {
      position: relative;
      z-index: 1;
      padding: 60px 24px 40px;
      text-align: center;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 178, 95, 0.25);
      border-radius: 100px;
      color: var(--accent-warm);
      background: rgba(255, 178, 95, 0.08);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .category-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.4); }
      50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(57, 255, 20, 0); }
    }

    .title {
      margin-bottom: 16px;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
    }

    .title span {
      color: var(--accent-warm);
    }

    .subtitle {
      max-width: 480px;
      margin: 0 auto;
      color: var(--text-secondary);
      font-size: 16px;
      font-weight: 300;
    }

    .type-stats {
      display: flex;
      justify-content: center;
      gap: 36px;
      margin-top: 32px;
      padding: 0 24px;
    }

    .type-stat {
      width: 96px;
      min-height: 88px;
      display: grid;
      place-items: center;
      gap: 4px;
      border: 1px solid rgba(255, 178, 95, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.025);
    }

    .type-value {
      color: var(--accent-warm);
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 600;
    }

    .type-label {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
    }

    .main {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .section-title {
      color: var(--accent-warm);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 178, 95, 0.3), var(--border-color), transparent);
    }

    .component-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
    }

    .card {
      position: relative;
      display: block;
      overflow: hidden;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: inherit;
      background: var(--bg-card);
      text-decoration: none;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s, box-shadow 0.4s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 178, 95, 0.32);
      box-shadow: var(--glow-type);
    }

    .card-preview {
      position: relative;
      height: 200px;
      overflow: hidden;
      background: linear-gradient(135deg, #11151f 0%, #090a0d 100%);
    }

    .card-preview-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .type-stack {
      width: 220px;
      display: grid;
      gap: 12px;
    }

    .type-line {
      height: 18px;
      border-radius: 3px;
      background: linear-gradient(90deg, rgba(255, 178, 95, 0.94), rgba(52, 214, 195, 0.72));
      animation: typeMeasure 4s ease-in-out infinite;
    }

    .type-line:nth-child(2) {
      width: 78%;
      height: 12px;
      animation-delay: -0.8s;
    }

    .type-line:nth-child(3) {
      width: 58%;
      height: 12px;
      animation-delay: -1.6s;
    }

    .glyph-row {
      display: flex;
      gap: 8px;
      padding-top: 4px;
    }

    .glyph {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
      font-size: 22px;
      font-weight: 700;
    }

    .glyph:nth-child(2) {
      font-family: Georgia, serif;
      color: var(--accent-warm);
    }

    .glyph:nth-child(3) {
      font-family: var(--font-mono);
      color: var(--accent-primary);
    }

    @keyframes typeMeasure {
      0%, 100% { transform: scaleX(0.82); transform-origin: left; }
      50% { transform: scaleX(1); transform-origin: left; }
    }

    .card-content {
      padding: 24px;
    }

    .card-tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      color: var(--accent-warm);
      background: rgba(255, 178, 95, 0.1);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: 600;
    }

    .card-arrow {
      width: 20px;
      height: 20px;
      opacity: 0.55;
      transition: transform 0.3s, opacity 0.3s;
    }

    .card:hover .card-arrow {
      transform: translate(4px, -4px);
      opacity: 1;
    }

    .card-desc {
      margin-bottom: 16px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .card-features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .feature {
      padding: 4px 10px;
      border: 1px solid var(--border-color);
      border-radius: 100px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .footer {
      position: relative;
      z-index: 1;
      padding: 40px 24px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .footer a {
      color: var(--accent-warm);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .header {
        padding: 40px 16px 28px;
      }

      .title {
        font-size: 44px;
      }

      .type-stats {
        gap: 16px;
      }

      .type-stat {
        width: 84px;
      }

      .component-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="scanlines"></div>

  <nav class="breadcrumb">
    <a href="../">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M5 12L12 19M5 12L12 5"/>
      </svg>
      <span>UI Lab トップへ戻る</span>
    </a>
  </nav>

  <header class="header">
    <div class="category-badge">
      <span>Text / Font Collection</span>
    </div>
    <h1 class="title">Text / Font <span>Gallery</span></h1>
    <p class="subtitle">書体、サイズ、行間、字間を調整するテキストUIコンポーネント</p>

    <div class="type-stats">
      <div class="type-stat">
        <span class="type-value">01</span>
        <span class="type-label">Variant</span>
      </div>
      <div class="type-stat">
        <span class="type-value">CSS</span>
        <span class="type-label">Vars</span>
      </div>
      <div class="type-stat">
        <span class="type-value">JS</span>
        <span class="type-label">Vanilla</span>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="section-header">
      <span class="section-title">// Available Type Tools</span>
      <div class="section-line"></div>
    </div>

    <div class="component-grid">
      <a href="./simple/" class="card">
        <div class="card-preview">
          <div class="card-preview-inner">
            <div class="type-stack">
              <div class="type-line"></div>
              <div class="type-line"></div>
              <div class="type-line"></div>
              <div class="glyph-row">
                <span class="glyph">A</span>
                <span class="glyph">あ</span>
                <span class="glyph">7</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card-content">
          <span class="card-tag">Basic</span>
          <h2 class="card-title">
            Simple Type Playground
            <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 17L17 7M17 7H7M17 7V17"/>
            </svg>
          </h2>
          <p class="card-desc">フォントファミリー、サイズ、ウェイト、行間、字間、行幅をライブプレビューで調整できます。</p>
          <div class="card-features">
            <span class="feature">Font Family</span>
            <span class="feature">Type Scale</span>
            <span class="feature">Tracking</span>
            <span class="feature">Copy CSS</span>
          </div>
        </div>
      </a>
    </div>
  </main>

  <footer class="footer">
    <a href="../">← UI Lab に戻る</a>
  </footer>
</body>
</html>
